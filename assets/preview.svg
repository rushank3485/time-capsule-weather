<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c15" />
      <stop offset="50%" stop-color="#111628" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>
    
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="vintageCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbf8f0" />
      <stop offset="100%" stop-color="#eee4cf" />
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="680" fill="url(#bgGrad)" />
  <circle cx="200" cy="150" r="300" fill="url(#amberGlow)" />
  <circle cx="1050" cy="500" r="250" fill="url(#amberGlow)" />

  <!-- LEFT: App UI Mockup (Width 640) -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <!-- Browser/App Frame -->
    <rect width="660" height="580" rx="16" fill="#101524" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    
    <!-- Top bar -->
    <rect width="660" height="50" rx="16" fill="#161c30" />
    <circle cx="28" cy="25" r="5" fill="#ef4444" />
    <circle cx="44" cy="25" r="5" fill="#f59e0b" />
    <circle cx="60" cy="25" r="5" fill="#10b981" />
    <text x="330" y="31" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">time-capsule-weather.vercel.app</text>

    <!-- App Header -->
    <text x="35" y="90" font-family="serif" font-size="20" font-weight="bold" fill="#fbbf24">⏳ TIME CAPSULE WEATHER</text>
    <rect x="290" y="74" width="110" height="22" rx="11" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1" />
    <text x="345" y="89" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">ALMANAC v2.0</text>

    <!-- Inputs bar -->
    <rect x="35" y="115" width="220" height="38" rx="8" fill="#0b0f1a" stroke="rgba(255,255,255,0.12)" />
    <text x="48" y="139" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">📍 Mumbai, Maharashtra, IN</text>

    <rect x="265" y="115" width="160" height="38" rx="8" fill="#0b0f1a" stroke="rgba(255,255,255,0.12)" />
    <text x="278" y="139" font-family="system-ui, sans-serif" font-size="12" fill="#fbbf24">📅 2000-01-01</text>

    <rect x="435" y="115" width="105" height="38" rx="8" fill="url(#btnGrad)" />
    <text x="487" y="139" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">Open Capsule</text>

    <rect x="548" y="115" width="77" height="38" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
    <text x="586" y="139" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">✨ Surprise</text>

    <!-- Weather Hero Card -->
    <rect x="35" y="175" width="590" height="175" rx="14" fill="rgba(24,31,51,0.7)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <text x="55" y="210" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">🏛️ Mumbai, India · January 1, 2000</text>
    <text x="55" y="275" font-family="monospace" font-size="56" font-weight="bold" fill="#ffffff">25.0°C</text>
    <text x="260" y="248" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fbbf24">Clear Sky</text>
    <text x="260" y="275" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">High: <tspan fill="#f87171" font-weight="bold">30.9°C</tspan>  ·  Low: <tspan fill="#60a5fa" font-weight="bold">18.3°C</tspan></text>
    
    <rect x="55" y="300" width="370" height="32" rx="6" fill="rgba(255,255,255,0.04)" />
    <text x="70" y="321" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">📈 <tspan font-weight="bold" fill="#fbbf24">+1.8°C warmer</tspan> than 2012–2021 historical baseline.</text>

    <!-- Weather Emoji Art -->
    <text x="540" y="270" font-size="70" text-anchor="middle">☀️</text>

    <!-- 4 Metrics Boxes -->
    <g transform="translate(35, 365)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="138" height="65" rx="10" fill="#151b2c" stroke="rgba(255,255,255,0.06)" />
      <text x="14" y="25" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-transform="uppercase">🌧️ PRECIPITATION</text>
      <text x="14" y="50" font-family="monospace" font-size="15" font-weight="bold" fill="#fff">0.0 mm</text>

      <!-- Box 2 -->
      <rect x="150" y="0" width="138" height="65" rx="10" fill="#151b2c" stroke="rgba(255,255,255,0.06)" />
      <text x="164" y="25" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-transform="uppercase">💨 MAX WIND</text>
      <text x="164" y="50" font-family="monospace" font-size="15" font-weight="bold" fill="#fff">12.7 km/h</text>

      <!-- Box 3 -->
      <rect x="300" y="0" width="138" height="65" rx="10" fill="#151b2c" stroke="rgba(255,255,255,0.06)" />
      <text x="314" y="25" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-transform="uppercase">🌅 SUNRISE/SET</text>
      <text x="314" y="50" font-family="monospace" font-size="14" font-weight="bold" fill="#fff">07:11 · 18:11</text>

      <!-- Box 4 -->
      <rect x="450" y="0" width="140" height="65" rx="10" fill="#151b2c" stroke="rgba(255,255,255,0.06)" />
      <text x="464" y="25" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-transform="uppercase">⏳ DAY LENGTH</text>
      <text x="464" y="50" font-family="monospace" font-size="15" font-weight="bold" fill="#fff">11h 00m</text>
    </g>

    <!-- History Bar -->
    <rect x="35" y="445" width="590" height="115" rx="12" fill="rgba(24,31,51,0.5)" stroke="rgba(255,255,255,0.06)" />
    <text x="50" y="470" font-family="serif" font-size="12" font-weight="bold" fill="#fbbf24">📜 ALSO ON THIS DAY IN HISTORY (JANUARY 1)</text>
    <rect x="50" y="482" width="40" height="18" rx="4" fill="rgba(245,158,11,0.2)" />
    <text x="70" y="495" font-family="monospace" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">2000</text>
    <text x="98" y="495" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">The Y2K bug passes without major worldwide computing disruptions.</text>
    
    <rect x="50" y="512" width="40" height="18" rx="4" fill="rgba(56,189,248,0.2)" />
    <text x="70" y="525" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">1999</text>
    <text x="98" y="525" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">The Euro currency is officially introduced in 11 European countries.</text>
  </g>

  <!-- RIGHT: 1080x1350 Share Card Mockup (Width 380, Height 520) -->
  <g transform="translate(760, 80)" filter="url(#shadow)">
    <!-- Card Frame -->
    <rect width="380" height="520" rx="18" fill="url(#vintageCard)" stroke="#8c7355" stroke-width="4" />
    <rect x="12" y="12" width="356" height="496" rx="12" fill="none" stroke="#8c7355" stroke-width="1.5" stroke-dasharray="4 2" />

    <!-- Card Top Header -->
    <text x="190" y="50" font-family="serif" font-size="14" font-weight="bold" fill="#a25a28" text-anchor="middle" letter-spacing="2">TIME CAPSULE WEATHER</text>
    <text x="190" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#71624f" text-anchor="middle">ATMOSPHERIC ARCHIVES &amp; MEMORIES</text>

    <!-- Card Headline -->
    <text x="190" y="105" font-family="serif" font-size="18" font-weight="bold" fill="#1c1813" text-anchor="middle">The Weather in History</text>
    <text x="190" y="128" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#a25a28" text-anchor="middle">Mumbai, India</text>
    <text x="190" y="148" font-family="system-ui, sans-serif" font-size="12" fill="#635848" text-anchor="middle">January 1, 2000</text>

    <!-- Inner Weather Card -->
    <rect x="35" y="165" width="310" height="155" rx="14" fill="rgba(255,255,255,0.7)" stroke="#8c7355" stroke-width="1.5" />
    <text x="190" y="215" font-size="44" text-anchor="middle">☀️</text>
    <text x="190" y="258" font-family="monospace" font-size="34" font-weight="bold" fill="#1c1813" text-anchor="middle">25.0°C</text>
    <text x="190" y="280" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#a25a28" text-anchor="middle">Clear Sky</text>
    <text x="190" y="302" font-family="system-ui, sans-serif" font-size="11" fill="#635848" text-anchor="middle">High: 30.9°C  ·  Low: 18.3°C</text>

    <!-- 4 Stats in Card -->
    <g transform="translate(35, 332)">
      <rect x="0" y="0" width="70" height="42" rx="6" fill="rgba(255,255,255,0.5)" stroke="#8c7355" stroke-width="1" />
      <text x="35" y="15" font-family="system-ui, sans-serif" font-size="7" fill="#635848" text-anchor="middle">RAIN</text>
      <text x="35" y="32" font-family="monospace" font-size="10" font-weight="bold" fill="#1c1813" text-anchor="middle">0.0mm</text>

      <rect x="80" y="0" width="70" height="42" rx="6" fill="rgba(255,255,255,0.5)" stroke="#8c7355" stroke-width="1" />
      <text x="115" y="15" font-family="system-ui, sans-serif" font-size="7" fill="#635848" text-anchor="middle">WIND</text>
      <text x="115" y="32" font-family="monospace" font-size="10" font-weight="bold" fill="#1c1813" text-anchor="middle">12.7km/h</text>

      <rect x="160" y="0" width="70" height="42" rx="6" fill="rgba(255,255,255,0.5)" stroke="#8c7355" stroke-width="1" />
      <text x="195" y="15" font-family="system-ui, sans-serif" font-size="7" fill="#635848" text-anchor="middle">SUNRISE</text>
      <text x="195" y="32" font-family="monospace" font-size="9" font-weight="bold" fill="#1c1813" text-anchor="middle">07:11</text>

      <rect x="240" y="0" width="70" height="42" rx="6" fill="rgba(255,255,255,0.5)" stroke="#8c7355" stroke-width="1" />
      <text x="275" y="15" font-family="system-ui, sans-serif" font-size="7" fill="#635848" text-anchor="middle">SUNSET</text>
      <text x="275" y="32" font-family="monospace" font-size="9" font-weight="bold" fill="#1c1813" text-anchor="middle">18:11</text>
    </g>

    <!-- History Quote Box -->
    <rect x="35" y="386" width="310" height="75" rx="8" fill="rgba(255,255,255,0.5)" stroke="#8c7355" stroke-width="1" />
    <text x="48" y="405" font-family="serif" font-size="9" font-weight="bold" fill="#a25a28">📜 ALSO ON THIS DAY IN HISTORY:</text>
    <text x="48" y="423" font-family="system-ui, sans-serif" font-size="9.5" fill="#1c1813">2000: Y2K bug passes smoothly without</text>
    <text x="48" y="438" font-family="system-ui, sans-serif" font-size="9.5" fill="#1c1813">global technological disruptions.</text>

    <!-- Card Footer -->
    <text x="190" y="488" font-family="monospace" font-size="8.5" fill="#71624f" text-anchor="middle">time-capsule-weather.vercel.app</text>
  </g>
</svg>
